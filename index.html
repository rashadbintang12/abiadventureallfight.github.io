<style>
html,body{margin:0;height:100%;background:#05030a;overflow:hidden;font-family:'Arial Black',Impact,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{background:#000;box-shadow:0 0 50px rgba(255,60,90,.35)}
#touch{--s:70px;--g:10px;--b:calc(14px + env(safe-area-inset-bottom,0px));--e:calc(12px + env(safe-area-inset-left,0px));position:fixed;left:0;right:0;bottom:0;height:200px;display:none;pointer-events:none;z-index:5;-webkit-touch-callout:none}
.tb{position:absolute;pointer-events:auto;width:var(--s);height:var(--s);border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.6);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(2px)}
.tb small{position:absolute;bottom:-1px;font-size:10px;font-family:Arial,sans-serif;font-weight:bold;opacity:.85}
.tb.on{background:rgba(255,80,80,.65);transform:scale(.92)}
#bL{left:var(--e);bottom:var(--b)}
#bR{left:calc(var(--e) + var(--s) + var(--g));bottom:var(--b)}
#bD{left:var(--e);bottom:calc(var(--b) + var(--s) + var(--g))}
#bU{left:calc(var(--e) + var(--s) + var(--g));bottom:calc(var(--b) + var(--s) + var(--g))}
#bP{right:var(--e);bottom:var(--b);background:rgba(255,90,90,.3)}
#bK{right:calc(var(--e) + var(--s) + var(--g));bottom:var(--b);background:rgba(80,160,255,.3)}
#bS{right:var(--e);bottom:calc(var(--b) + var(--s) + var(--g));background:rgba(255,200,40,.4)}
#fs{position:fixed;top:6px;right:6px;width:40px;height:40px;border-radius:10px;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.4);color:#fff;font-size:20px;display:none;align-items:center;justify-content:center;z-index:6}
@media (max-height:430px){#touch{--s:58px;--g:8px;height:160px}.tb{font-size:23px}}
</style>

/* ================= AUDIO ================= */
let AC=null,muted=false;
function ac(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f1,f2,dur,type,vol,delay){
  if(!AC||muted)return;
  const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+dur);
  g.gain.setValueAtTime(vol||.15,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+.03);
}
function noise(dur,vol){
  if(!AC||muted)return;
  const n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=vol||.2;s.connect(g);g.connect(AC.destination);s.start();
}
const SFX={
  punch(){tone(260,90,.09,'square',.14);},
  kick(){tone(200,60,.12,'sawtooth',.15);},
  hit(){noise(.12,.25);tone(160,50,.14,'sawtooth',.2);},
  block(){tone(700,300,.08,'triangle',.22);},
  special(){tone(300,1000,.28,'sawtooth',.16);},
  jump(){tone(300,650,.1,'sine',.12);},
  ko(){noise(.5,.3);tone(300,40,.6,'sawtooth',.2);},
  combo(n){const b=420+Math.min(n,12)*70;tone(b,b*1.5,.12,'square',.14);tone(b*1.5,b*2,.12,'triangle',.1,.06);},
  select(){tone(700,900,.05,'square',.1);},
  confirm(){tone(500,1100,.12,'square',.14);},

function dk(h,a){const n=parseInt(h.slice(1),16);return`rgb(${Math.round((n>>16)*a)},${Math.round(((n>>8)&255)*a)},${Math.round((n&255)*a)})`;}
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0.1,r),0,TAU);ctx.fill();}
function ell(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,TAU);ctx.fill();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function rrf(x,y,w,h,r){rr(x,y,w,h,r);ctx.fill();}
function limb(x1,y1,x2,y2,w,col){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function txt(s,x,y,size,col,align,stroke){
  ctx.font=size+'px Impact,"Arial Black",sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';
  if(stroke){ctx.lineWidth=Math.max(2,size/7);ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(s,x,y);}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function ik(sx,sy,hx,hy,seg,s){
  let dx=hx-sx,dy=hy-sy,len=Math.hypot(dx,dy)||1;const mx=seg*2-.5;
  if(len>mx){hx=sx+dx/len*mx;hy=sy+dy/len*mx;dx=hx-sx;dy=hy-sy;len=mx;}
  const h=Math.sqrt(Math.max(0,seg*seg-(len/2)*(len/2)));
  return{ex:sx+dx/2-s*dy/len*h,ey:sy+dy/2+s*dx/len*h,hx:hx,hy:hy};
}
function arm(sx,sy,hx,hy,w,col,glove){
  const r=ik(sx,sy,hx,hy,34,1);limb(sx,sy,r.ex,r.ey,w,col);limb(r.ex,r.ey,r.hx,r.hy,w,col);
  ctx.fillStyle=glove;circle(r.hx,r.hy,8.5);
}
function leg(hx,hy,fx,fy,col){
  const r=ik(hx,hy,fx,fy,42,-1);limb(hx,hy,r.ex,r.ey,16,col);limb(r.ex,r.ey,r.hx,r.hy,15,col);
  ctx.fillStyle='#1c1c1c';ell(r.hx+6,r.hy-3,14,7);
}

function spark(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=Math.random()*(sp||6)+2;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20+Math.random()*12,max:32,col:col,size:2+Math.random()*4,g:.15,type:'s'});}}
function puff(x,y,col,n){for(let i=0;i<(n||6);i++){parts.push({x:x+(Math.random()-.5)*20,y:y+(Math.random()-.5)*10,vx:(Math.random()-.5)*3,vy:-Math.random()*2,life:26,max:26,col:col||'#ddd',size:6+Math.random()*8,g:-.02,type:'p'});}}
function addText(x,y,s,col,size,life){texts.push({x:x,y:y,s:s,col:col,size:size||22,life:life||50,max:life||50});}
function updateFx(){

}

  triple:{len:30,run(f,m){if(f===12){for(const a of[-.2,0,.2])m.shoot({vx:9*Math.cos(a),vy:9*Math.sin(a),r:10,dmg:7});}}},
  shock:{len:34,run(f,m){if(f===14)m.shoot({vx:7,r:20,dmg:13,low:true,dy:-20});}},

    box(f){return(f>=4&&f<34)?{x0:-82,x1:82,y0:-145,y1:-8,dmg:5,kb:5,stun:14}:null;}},
  uppercut:{len:40,
    run(f,m){if(f===5){m.vy=-15;m.vx=m.face*2;}},
    box(f){return(f>=5&&f<20)?{x0:0,x1:70,y0:-205,y1:-40,dmg:16,kb:6,stun:24,up:true}:null;}},

    run(f,m,o){
      if(f===10){
        puff(m.x,m.y-70,'#c9a0ff',8);spark(m.x,m.y-70,'#e0aaff',12,6);
        const s=m.x<o.x?1:-1;let nx=o.x+s*64;if(nx<50||nx>W-50)nx=o.x-s*64;
        m.x=clamp(nx,40,W-40);m.face=o.x>=m.x?1:-1;
        puff(m.x,m.y-70,'#c9a0ff',8);spark(m.x,m.y-70,'#e0aaff',12,6);
      }
    },
    box(f){return(f>=12&&f<19)?{x0:5,x1:95,y0:-140,y1:-20,dmg:14,kb:10,stun:20}:null;}}
};
function spOK(f,ad){
  const s=f.ch.sp;
  if(['fireball','big','beam','triple','shock','rain'].includes(s))return ad>150;
  if(s==='dash')return ad>100&&ad<320;
  if(s==='spin'||s==='uppercut')return ad<115;
  return ad<500;
}

/* ================= FIGHTER ================= */
class Fighter{
  constructor(ch,side,ctrl,ai){
    this.ch=ch;this.side=side;this.ctrl=ctrl;this.maxhp=ch.hp;this.meter=0;
    this.ai=ai?{t:0,mode:'idle',lvl:.5}:null;
    this.reset();
  }
  reset(){
    this.x=this.side?W/2+170:W/2-170;this.y=GY;this.vx=0;this.vy=0;this.face=this.side?-1:1;
    this.hp=this.maxhp;this.trail=this.hp;this.st='idle';this.atk=null;this.hitDone=false;this.stun=0;
    this.blocking=false;this.air=false;this.anim=0;this.stT=0;this.combo=0;this.comboT=0;this.comboDmg=0;this.comboPop=0;this.hurtFlash=0;
  }
  hb(){return{x0:this.x-26,x1:this.x+26,y0:this.y-150,y1:this.y};}
  shoot(o){
    projs.push({x:this.x+this.face*40,y:this.y+(o.dy!==undefined?o.dy:-95),vx:(o.vx||0)*this.face,vy:o.vy||0,
      r:o.r||14,w:o.w||0,dmg:(o.dmg||10)*this.ch.pow,kb:o.kb||8,stun:o.stun||18,owner:this,col:this.ch.col,
      life:o.life||120,low:!!o.low,big:!!o.big,beam:!!o.beam,rot:0});
    SFX.special();
  }
  update(I,o){
    this.anim++;this.stT++;
    if(this.hurtFlash>0)this.hurtFlash--;
    if(this.comboPop>0)this.comboPop--;
    if(this.comboT>0){this.comboT--;if(!this.comboT){this.combo=0;this.comboDmg=0;}}
    if(this.trail>this.hp)this.trail=Math.max(this.hp,this.trail-.35);
    this.meter=Math.min(100,this.meter+.02);
    this.blocking=false;
    const grounded=this.y>=GY&&this.vy>=0;
    switch(this.st){
      case 'ko':case 'win':break;
      case 'hit':if(--this.stun<=0)this.st=grounded?'idle':'jump';break;
      case 'atk':this.doAttack(o);break;
      default:this.control(I,o,grounded);
    }
    this.vy+=.85;this.x+=this.vx;this.y+=this.vy;
    if(this.y>=GY){
      if(this.air&&this.vy>6)puff(this.x,GY,'#ccc',4);
      this.y=GY;this.vy=0;this.air=false;if(this.st==='jump')this.st='idle';
    }else this.air=true;
    this.x=clamp(this.x,40,W-40);
    if(this.y>=GY&&(this.st==='hit'||this.st==='ko'||this.st==='win'||(this.st==='atk'&&this.atk&&!this.atk.sp)))this.vx*=.8;
  }
  control(I,o,grounded){
    const spd=this.ch.spd,dir=(I.r?1:0)-(I.l?1:0);
    if(grounded){
      this.face=o.x>=this.x?1:-1;
      if(I.d){this.blocking=true;this.vx=0;this.st='idle';}
      else{
        this.vx=dir*spd;this.st=dir?'walk':'idle';
        if(I.u){this.vy=-17.5;this.st='jump';SFX.jump();puff(this.x,GY,'#ccc',3);}
      }
    }else{
      this.st='jump';if(dir)this.vx=lerp(this.vx,dir*spd,.15);
    }
    if(!this.blocking){
      if(I.pp)this.startAttack('punch');
      else if(I.kp)this.startAttack('kick');
      else if(I.sp&&this.meter>=50){this.meter-=50;this.startAttack('special');}
    }
  }
  startAttack(name){
    let a;
    if(name==='special'){
      const d=SP[this.ch.sp];a={f:0,sp:this.ch.sp,len:d.len,name:name};
      SFX.special();flash=Math.max(flash,.3);shake=Math.max(shake,10);vib(25);addText(this.x,this.y-200,this.ch.spn,this.ch.col,26,55);
    }else{
      const d=ATK[name];
      a={f:0,name:name,su:d.su,ac:d.ac,rc:d.rc,len:d.su+d.ac+d.rc,rng:d.rng,y0:d.y0,y1:d.y1,dmg:d.dmg*this.ch.pow,kb:d.kb,stun:d.stun};
      SFX[name]();
    }
    this.atk=a;this.st='atk';this.hitDone=false;
    if(!this.air)this.vx=0;
  }
  getBox(){
    const a=this.atk;if(!a)return null;let b=null;
    if(a.sp){const d=SP[a.sp];if(d.box){b=d.box(a.f,this);if(b)b=Object.assign({},b,{dmg:b.dmg*this.ch.pow});}}
    else if(a.f>=a.su&&a.f<a.su+a.ac)b={x0:8,x1:a.rng,y0:a.y0,y1:a.y1,dmg:a.dmg,kb:a.kb,stun:a.stun};
    if(!b)return null;
    const f=this.face,x0=f>0?this.x+b.x0:this.x-b.x1,x1=f>0?this.x+b.x1:this.x-b.x0;
    return{x0:x0,x1:x1,y0:this.y+b.y0,y1:this.y+b.y1,dmg:b.dmg,kb:b.kb,stun:b.stun,up:b.up};
  }
  doAttack(o){
    const a=this.atk;a.f++;
    if(a.sp)SP[a.sp].run(a.f,this,o);
    const b=this.getBox();
    if(b&&!this.hitDone&&o.st!=='ko'&&o.st!=='win'&&fp==='play'){
      const h=o.hb();
      if(b.x0<h.x1&&b.x1>h.x0&&b.y0<h.y1&&b.y1>h.y0){this.hitDone=true;hurt(this,o,b);}
    }
    if(a.f>=a.len){this.atk=null;this.st=this.air?'jump':'idle';}
  }
}

function hurt(att,def,b){
  const dir=b.dir!==undefined?b.dir:(att.x<=def.x?1:-1),hb=def.hb();
  const sx=(Math.max(b.x0,hb.x0)+Math.min(b.x1,hb.x1))/2,sy=(Math.max(b.y0,hb.y0)+Math.min(b.y1,hb.y1))/2;
  let dmg=b.dmg;
  if(def.blocking&&!def.air){
    dmg=Math.max(1,dmg*.12);def.hp=Math.max(1,def.hp-dmg);def.vx=dir*4;
    hitstop=Math.max(hitstop,3);shake=Math.max(shake,5);vib(8);SFX.block();spark(sx,sy,'#8fd3ff',8,5);
    att.meter=Math.min(100,att.meter+2);def.meter=Math.min(100,def.meter+3);
    addText(sx,sy-20,'BLOK',  '#8fd3ff',18,30);
  }else{
    att.comboT=80;att.combo=(def.st==='hit')?att.combo+1:1;
    if(att.combo===1)att.comboDmg=0;
    dmg=dmg*Math.max(.55,1-.07*(att.combo-1));
    att.comboDmg+=dmg;
    if(att.combo>=2){att.comboPop=14;SFX.combo(att.combo);}
    def.hp-=dmg;def.hurtFlash=8;def.atk=null;def.st='hit';def.stun=b.stun;def.vx=dir*b.kb;
    if(b.up)def.vy=-13;else if(def.air)def.vy=-4;
    att.meter=Math.min(100,att.meter+dmg*1.3);def.meter=Math.min(100,def.meter+dmg*.7);
    const big=b.dmg>=12;
    hitstop=Math.max(hitstop,big?9:5);shake=Math.max(shake,(big?26:14)+Math.min(10,att.combo*1.5));
    if(big)flash=Math.max(flash,.14);
    vib(big?45:22);
    SFX.hit();spark(sx,sy,'#fff2a8',big?16:10,big?9:6);spark(sx,sy,'#ff7a3d',6,5);
    addText(sx,sy-30,String(Math.round(dmg)),'#ffd23f',big?30:22,36);
    if(def.hp<=0){def.hp=0;def.st='ko';def.vy=-9;def.vx=dir*7;def.stT=0;hitstop=14;shake=40;flash=Math.max(flash,.3);vib([80,40,160]);}
  }
}

/* ================= PROJECTILES ================= */
function pbox(p){return p.beam?{x0:p.x-p.w/2,x1:p.x+p.w/2,y0:p.y-p.r,y1:p.y+p.r}:{x0:p.x-p.r,x1:p.x+p.r,y0:p.y-p.r,y1:p.y+p.r};}
function ov(a,b){return a.x0<b.x1&&a.x1>b.x0&&a.y0<b.y1&&a.y1>b.y0;}
function updateProjs(){
  for(const p of projs){
    p.x+=p.vx;p.y+=p.vy;p.life--;p.rot+=.2;
    if(p.life%2===0&&!p.rock)parts.push({x:p.x,y:p.y,vx:0,vy:0,life:10,max:10,col:p.col,size:p.r*.8,g:0,type:'p'});
  }
  for(let i=0;i<projs.length;i++)for(let j=i+1;j<projs.length;j++){
    const a=projs[i],b=projs[j];
    if(a.dead||b.dead||a.owner===b.owner||a.rock||b.rock)continue;
    if(ov(pbox(a),pbox(b))){
      spark((a.x+b.x)/2,(a.y+b.y)/2,'#ffffff',10,6);SFX.block();
      if(a.big&&!b.big)b.dead=true;else if(b.big&&!a.big)a.dead=true;else{a.dead=true;b.dead=true;}
    }
  }
  if(fp==='play'){
    for(const p of projs){
      if(p.dead)continue;
      const def=p.owner===P[0]?P[1]:P[0];
      if(def.st==='ko'||def.st==='win')continue;
      const pb=pbox(p),h=def.hb();
      if(ov(pb,h)){
        const dir=p.vx>0?1:p.vx<0?-1:(p.owner.x<def.x?1:-1);
        hurt(p.owner,def,{x0:pb.x0,x1:pb.x1,y0:pb.y0,y1:pb.y1,dmg:p.dmg,kb:p.kb,stun:p.stun,dir:dir});
        p.dead=true;
      }
    }
  }
  projs=projs.filter(p=>{
    if(p.dead)return false;
    if(p.rock&&p.y>=GY-p.r){puff(p.x,GY,'#b8a88a',6);return false;}
    return p.life>0&&p.x>-100&&p.x<W+100&&p.y<GY+40;
  });
}

/* ================= AI ================= */
function aiInput(f,o){
  const I={l:0,r:0,u:0,d:0,pp:0,kp:0,sp:0},m=f.ai;
  if(f.st==='atk'||f.st==='hit'||f.st==='ko'||f.st==='win')return I;
  const dx=o.x-f.x,ad=Math.abs(dx),dir=dx>=0?1:-1,lvl=m.lvl;
  m.t--;
  if(m.t<=0){
    m.t=Math.floor(16-lvl*10+Math.random()*10);
    const r=Math.random();
    let threat=null;
    for(const p of projs){
      if(p.owner!==o)continue;
      if(p.rock?Math.abs(p.x-f.x)<70:(Math.abs(p.x-f.x)<230&&((p.vx>0&&p.x<f.x)||(p.vx<0&&p.x>f.x)))){threat=p;break;}
    }
    if(threat&&Math.random()<.3+lvl*.6){m.mode=(threat.low||threat.rock)?'jump':(Math.random()<.7?'block':'jump');m.t=18;}
    else if(o.st==='atk'&&ad<150&&Math.random()<.2+lvl*.6){m.mode='block';m.t=14;}
    else if(ad>380)m.mode=(f.meter>=50&&r<.5)?'special':(r<.12?'jump':'approach');
    else if(ad>170)m.mode=(f.meter>=50&&r<.3+lvl*.2)?'special':(r<.1?'jump':(r<.2?'retreat':'approach'));
    else{
      if(f.meter>=50&&r<.25)m.mode='special';else if(r<.4)m.mode='punch';else if(r<.65)m.mode='kick';
      else if(r<.78)m.mode='block';else if(r<.9)m.mode='retreat';else m.mode='jump';
    }
  }
  switch(m.mode){
    case 'approach':if(ad>100){if(dir>0)I.r=1;else I.l=1;}else m.t=0;break;
    case 'retreat':if(dir>0)I.l=1;else I.r=1;break;
    case 'block':I.d=1;break;
    case 'punch':if(ad<112){I.pp=1;m.mode='idle';}else{if(dir>0)I.r=1;else I.l=1;}break;
    case 'kick':if(ad<125){I.kp=1;m.mode='idle';}else{if(dir>0)I.r=1;else I.l=1;}break;
    case 'special':if(f.meter>=50&&spOK(f,ad))I.sp=1;m.mode='idle';break;
    case 'jump':I.u=1;if(dir>0)I.r=1;else I.l=1;m.mode='idle';break;
  }
  return I;
}

/* ================= FLOW ================= */
function startMatch(a,b){
  phase='fight';paused=false;champion=false;
  let c2=CH[b];if(a===b)c2=Object.assign({},CH[b],{col:CH[b].pants,pants:CH[b].col});
  P[0]=new Fighter(CH[a],0,mode==='vs2p'?CT_P1:CT_1P,false);
  P[1]=new Fighter(c2,1,CT2,mode!=='vs2p');
  if(P[1].ai)P[1].ai.lvl=mode==='arcade'?Math.min(.85,.12+arcIdx*.085):.5;
  if(mode==='arcade')P[0].meter=30;
  stageI=mode==='arcade'?ARC_STAGE[arcIdx%ARC_STAGE.length]:(selStage>=0?selStage:Math.floor(Math.random()*STAGES.length));
  round=1;wins=[0,0];newRound();
}
function newRound(){P[0].reset();P[1].reset();projs=[];fp='intro';ft=0;timer=60;tf=0;koText='';roundWinner=-1;}
function endRound(){
  const a=P[0],b=P[1];fp='end';ft=0;let w=-1;
  if(a.hp<=0&&b.hp<=0){koText='DOUBLE K.O.!';}
  else if(a.hp<=0){w=1;koText='K.O.!';}
  else if(b.hp<=0){w=0;koText='K.O.!';}
  else if(a.hp>b.hp){w=0;koText='WAKTU HABIS!';}
  else if(b.hp>a.hp){w=1;koText='WAKTU HABIS!';}
  else koText='SERI!';
  roundWinner=w;
  if(w>=0){
    wins[w]++;const wf=P[w],lf=P[1-w];
    wf.st='win';wf.atk=null;wf.stT=0;
    if(lf.st!=='ko'){lf.st='ko';lf.atk=null;lf.vy=-8;lf.vx=(lf.x<wf.x?-1:1)*5;lf.stT=0;}
  }else{
    for(const f of P)if(f.st!=='ko'){f.st='ko';f.atk=null;f.vy=-8;f.stT=0;}
  }
  matchDone=wins[0]>=2||wins[1]>=2;
  flash=.8;shake=Math.max(shake,30);SFX.ko();
}
function setupResult(){
  const p1won=wins[0]>wins[1];champion=false;
  if(mode==='arcade'){
    if(p1won){
      if(arcIdx>=ORDER.length-1){champion=true;resultMsg='ABI MENGALAHKAN SEMUA!';resultSub='JUARA ABI VS ALL FIGHT!';}
      else{resultMsg='MENANG!';resultSub='Berikutnya: '+CH[ORDER[arcIdx+1]].n+' ('+(arcIdx+2)+'/'+ORDER.length+')';}
    }else{resultMsg='KALAH...';resultSub='Coba lagi lawan '+CH[ORDER[arcIdx]].n;}
  }else{
    resultMsg=P[p1won?0:1].ch.n+' MENANG!';resultSub='Ronde ulang? Lanjut tantang lagi!';
  }
  if(champion){for(let i=0;i<120;i++)parts.push({x:Math.random()*W,y:-Math.random()*300,vx:(Math.random()-.5)*2,vy:1+Math.random()*3,life:200,max:200,col:['#ff4d6d','#ffd23f','#4dd0e1','#9d4edd','#7dff7d'][i%5],size:5+Math.random()*4,g:.03,type:'c',rot:Math.random()*6,vr:(Math.random()-.5)*.3});}
}
function proceed(){
  SFX.confirm();
  if(mode==='arcade'){
    if(wins[0]>wins[1]){if(arcIdx>=ORDER.length-1){toMenu();return;}arcIdx++;}
    startMatch(0,ORDER[arcIdx]);
  }else startMatch(sel[0],sel[1]);
}
function toMenu(){phase='menu';paused=false;parts=[];projs=[];texts=[];SFX.select();}
function activate(i){
  SFX.confirm();
  if(i===0){mode='arcade';arcIdx=0;startMatch(0,ORDER[0]);}
  else if(i===1||i===2){mode=i===1?'vscpu':'vs2p';phase='select';selStep=0;cur=0;}
  else phase='controls';
}
function confirmSel(){
  SFX.confirm();
  if(selStep===0){sel[0]=cur;selStep=1;cur=cur===0?1:0;}
  else{sel[1]=cur;startMatch(sel[0],sel[1]);}
}
function mapStep(d){
  const n=STAGES.length;
  if(d<0)selStage=selStage<=-1?n-1:selStage-1;
  else selStage=selStage>=n-1?-1:selStage+1;
  SFX.select();
}
function backSel(){SFX.select();if(selStep===1){selStep=0;cur=sel[0];}else phase='menu';}
function pauseAct(i){SFX.confirm();if(i===0)paused=false;else toMenu();}

function onKey(c){
  if(c==='KeyM'){muted=!muted;return;}
  const up=c==='ArrowUp'||c==='KeyW',dn=c==='ArrowDown'||c==='KeyS',lf=c==='ArrowLeft'||c==='KeyA',rt=c==='ArrowRight'||c==='KeyD';
  const ok=c==='Enter'||c==='Space'||c==='NumpadEnter',okSel=ok||c==='KeyF'||c==='KeyJ';
  if(phase==='menu'){
    if(up){menuIdx=(menuIdx+3)%4;SFX.select();}
    else if(dn){menuIdx=(menuIdx+1)%4;SFX.select();}
    else if(okSel)activate(menuIdx);
  }else if(phase==='controls'){
    if(ok||c==='Escape'||c==='Backspace'){phase='menu';SFX.select();}
  }else if(phase==='select'){
    if(lf){cur=(cur+10)%11;SFX.select();}
    else if(rt){cur=(cur+1)%11;SFX.select();}
    else if(up){if(cur>=6)cur-=6;SFX.select();}
    else if(dn){if(cur<=4)cur+=6;else if(cur===5)cur=10;SFX.select();}
    else if(c==='KeyQ')mapStep(-1);
    else if(c==='KeyE')mapStep(1);
    else if(okSel)confirmSel();
    else if(c==='Escape'||c==='Backspace')backSel();
  }else if(phase==='fight'){
    if(paused){
      if(up||dn){pauseIdx^=1;SFX.select();}
      else if(ok)pauseAct(pauseIdx);
      else if(c==='Escape'||c==='KeyP')paused=false;
    }else if(fp==='result'){
      if(ok)proceed();else if(c==='Escape')toMenu();
    }else if(c==='Escape'||c==='KeyP'){paused=true;pauseIdx=0;}
  }
}
const MENU_Y=i=>236+i*50;
function inR(p,x,y,w,h){return p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h;}
function cardRect(i){
  const row=i<6?0:1,col=i<6?i:i-6,cw=128,chh=136,gap=12,n=row?5:6,x0=(W-(n*cw+(n-1)*gap))/2;
  return{x:x0+col*(cw+gap),y:row?292:140,w:cw,h:chh};
}
function onPointer(p,click){
  if(phase==='menu'){
    for(let i=0;i<4;i++)if(inR(p,280,MENU_Y(i)-21,400,42)){if(menuIdx!==i&&!click)SFX.select();menuIdx=i;if(click)activate(i);}
  }else if(phase==='controls'){if(click){phase='menu';SFX.select();}}
  else if(phase==='select'){
    if(click&&inR(p,10,8,150,34)){backSel();return;}
    if(click&&inR(p,630,6,44,32)){mapStep(-1);return;}
    if(click&&inR(p,906,6,44,32)){mapStep(1);return;}
    for(let i=0;i<11;i++){const r=cardRect(i);if(inR(p,r.x,r.y,r.w,r.h)){cur=i;if(click)confirmSel();}}
  }else if(phase==='fight'){
    if(paused){
      for(let i=0;i<2;i++)if(inR(p,330,235+i*70,300,52)){pauseIdx=i;if(click)pauseAct(i);}
    }else if(click){
      if(fp==='result'){if(inR(p,500,370,230,58))toMenu();else proceed();}
      else if(Math.hypot(p.x-480,p.y-100)<34){paused=true;pauseIdx=0;}
    }
  }
}

/* ================= STEP ================= */
function menuStep(){
  if(!demoA){demoA=new Fighter(CH[0],0,CT1,false);demoA.x=190;demoB=new Fighter(CH[1],1,CT2,false);demoB.x=770;}
  demoA.anim++;demoB.anim++;
  if(t%420===0){menuStage=(menuStage+1)%STAGES.length;demoIdx=1+(demoIdx%10);demoB=new Fighter(CH[demoIdx],1,CT2,false);demoB.x=770;}
  for(const[d,off]of[[demoA,0],[demoB,50]]){
    if(!d.atk&&(t+off)%110===0){d.st='atk';d.atk={name:(t/110|0)%2?'kick':'punch',f:0,su:6,ac:4,rc:10,len:20,rng:90};}
    if(d.atk){d.atk.f++;if(d.atk.f>=d.atk.len){d.atk=null;d.st='idle';}}
  }
}
function fightStep(){
  const a=P[0],b=P[1];
  if(hitstop>0){hitstop--;updateFx();return false;}
  ft++;
  if(fp==='intro'){
    a.update(NOINP,b);b.update(NOINP,a);
    if(ft===1)SFX.bell();if(ft===72)SFX.fight();
    if(ft>=110){fp='play';ft=0;}
  }else if(fp==='play'){
    const ia=a.ai?aiInput(a,b):inp(a.ctrl),ib=b.ai?aiInput(b,a):inp(b.ctrl);
    a.update(ia,b);b.update(ib,a);
    updateProjs();
    const dx=b.x-a.x;
    if(Math.abs(dx)<46&&Math.abs(a.y-b.y)<80&&a.st!=='ko'&&b.st!=='ko'){
      const push=(46-Math.abs(dx))/2*(dx>=0?1:-1);a.x=clamp(a.x-push,40,W-40);b.x=clamp(b.x+push,40,W-40);
    }
    tf++;if(tf>=60){tf=0;timer--;}
    if(a.hp<=0||b.hp<=0||timer<=0)endRound();
  }else if(fp==='end'){
    a.update(NOINP,b);b.update(NOINP,a);updateProjs();
    if(ft>=170){if(matchDone){fp='result';ft=0;setupResult();}else{round++;newRound();}}
  }else if(fp==='result'){
    a.update(NOINP,b);b.update(NOINP,a);
  }
  updateFx();
  return true;
}
function step(){
  t++;let consumed=true;
  if(phase==='menu'){menuStep();updateFx();}
  else if(phase==='fight'&&!paused)consumed=fightStep()!==false;
  if(consumed)pressed.clear();
  const showT=isTouch&&phase==='fight'&&!paused&&fp!=='result';
  if(showT!==touchShown){touchShown=showT;touchEl.style.display=showT?'block':'none';}
}

/* ================= DRAW: STAGE ================= */
function palm(x,base,h,lean,col){
  ctx.strokeStyle=col;ctx.lineWidth=10;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x,base);ctx.quadraticCurveTo(x+lean*.3,base-h*.6,x+lean,base-h);ctx.stroke();
  ctx.lineWidth=5;
  for(let i=0;i<7;i++){
    const a=-Math.PI*.95+i*(Math.PI*.9/6),lx=x+lean+Math.cos(a)*80,ly=base-h+Math.sin(a)*40+30;
    ctx.beginPath();ctx.moveTo(x+lean,base-h);ctx.quadraticCurveTo(x+lean+Math.cos(a)*40,base-h+Math.sin(a)*60-20,lx,ly);ctx.stroke();
  }
}
function drawStage(i,tt){
  const S=STAGES[i];
  let g=ctx.createLinearGradient(0,0,0,GY);
  S.sky.forEach((c,k)=>g.addColorStop(k/(S.sky.length-1),c));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(S.type==='photo'){
    const im=PHOTO[S.photo];
    if(im&&im.complete&&im.naturalWidth)ctx.drawImage(im,0,0,W,H);
    ctx.fillStyle='rgba(0,0,0,'+S.dim+')';ctx.fillRect(0,0,W,H);
    const vg=ctx.createRadialGradient(480,260,200,480,260,620);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  }else if(S.type==='sea'){
    const sg=ctx.createRadialGradient(480,310,10,480,310,260);
    sg.addColorStop(0,'rgba(255,240,180,1)');sg.addColorStop(.3,'rgba(255,190,110,.8)');sg.addColorStop(1,'rgba(255,120,80,0)');
    ctx.fillStyle=sg;ctx.fillRect(0,60,W,340);
    ctx.fillStyle='#fff0b8';circle(480,312,60);
    g=ctx.createLinearGradient(0,330,0,GY);g.addColorStop(0,'#d9588a');g.addColorStop(1,'#2a2a6a');
    ctx.fillStyle=g;ctx.fillRect(0,330,W,GY-330);
    for(let k=0;k<7;k++){
      ctx.strokeStyle='rgba(255,230,170,'+(.55-k*.06)+')';ctx.lineWidth=2;ctx.beginPath();
      for(let x=0;x<=W;x+=20){const y=340+k*14+Math.sin(x*.03+tt*.04+k)*3;if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
      ctx.stroke();
    }
    palm(70,GY,250,50,'#2a1424');palm(890,GY,280,-60,'#2a1424');palm(150,GY,190,30,'#3b1c30');
  }else if(S.type==='city'){
    ctx.fillStyle='#fff';for(let k=0;k<90;k++){ctx.globalAlpha=.4+.6*rnd(k+9)*(.6+.4*Math.sin(tt*.05+k));circle(rnd(k)*W,rnd(k+50)*300,.6+rnd(k+3)*1.4);}
    ctx.globalAlpha=1;ctx.fillStyle='#f4f1de';circle(790,90,36);ctx.fillStyle='rgba(0,0,0,.1)';circle(780,82,8);circle(800,100,6);
    for(let layer=0;layer<2;layer++){
      for(let k=0;k<15;k++){
        const bw=60+rnd(k+layer*20)*30,bh=(layer?120:170)+rnd(k+layer*7)*(layer?130:170),bx=k*68-10+layer*30;
        ctx.fillStyle=layer?'#101030':'#1a1a45';ctx.fillRect(bx,GY-bh,bw,bh);
        for(let wy=GY-bh+10;wy<GY-14;wy+=18)for(let wx=bx+8;wx<bx+bw-8;wx+=14){
          if(rnd(wx*3+wy+layer)>.55){ctx.fillStyle=rnd(wx+wy)>.5?'#ffd86b':'#9ad1ff';ctx.fillRect(wx,wy,6,9);}
        }
      }
    }
  }else if(S.type==='dojo'){
    ctx.fillStyle='#5c3a1e';ctx.fillRect(0,0,W,GY);
    ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=2;for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,GY);ctx.stroke();}
    ctx.fillStyle='#f0e0b8';rrf(80,170,300,250,6);rrf(580,170,300,250,6);
    ctx.strokeStyle='#6b4a2a';ctx.lineWidth=4;
    for(const bx of[80,580]){for(let k=0;k<=3;k++){ctx.beginPath();ctx.moveTo(bx+k*100,170);ctx.lineTo(bx+k*100,420);ctx.stroke();}for(let k=0;k<=3;k++){ctx.beginPath();ctx.moveTo(bx,170+k*83);ctx.lineTo(bx+300,170+k*83);ctx.stroke();}}
    ctx.fillStyle='#b3202a';rrf(420,30,120,230,6);ctx.fillStyle='#f5e9c8';circle(480,110,36);ctx.fillStyle='#b3202a';circle(480,110,22);
    txt('ABI',480,200,34,'#f5e9c8','center');
    for(const lx of[190,770]){
      const gl=ctx.createRadialGradient(lx,110,5,lx,110,90);gl.addColorStop(0,'rgba(255,200,100,.7)');gl.addColorStop(1,'rgba(255,200,100,0)');
      ctx.fillStyle=gl;ctx.fillRect(lx-90,20,180,180);
      ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(lx,0);ctx.lineTo(lx,80);ctx.stroke();
      ctx.fillStyle='#d62828';ell(lx,110,26,32);ctx.fillStyle='#111';ctx.fillRect(lx-12,76,24,6);ctx.fillRect(lx-12,138,24,6);
    }
  }else if(S.type==='hills'){
    ctx.fillStyle='#fff6a8';circle(800,90,44);
    for(let k=0;k<4;k++){
      const cx=((tt*.25+k*300)%1200)-120,cy=70+k*38;ctx.fillStyle='rgba(255,255,255,.85)';
      ell(cx,cy,60,20);ell(cx+34,cy-12,40,18);ell(cx-34,cy-8,34,15);
    }
    ctx.fillStyle='#7fc8a0';ctx.beginPath();ctx.moveTo(0,GY);for(let x=0;x<=W;x+=20)ctx.lineTo(x,330+Math.sin(x*.008)*40);ctx.lineTo(W,GY);ctx.fill();
    ctx.fillStyle='#4fa05a';ctx.beginPath();ctx.moveTo(0,GY);for(let x=0;x<=W;x+=20)ctx.lineTo(x,370+Math.sin(x*.012+2)*30);ctx.lineTo(W,GY);ctx.fill();
    ctx.strokeStyle='rgba(30,90,30,.35)';ctx.lineWidth=2;for(let k=0;k<5;k++){ctx.beginPath();for(let x=0;x<=W;x+=20){const y=385+k*11+Math.sin(x*.012+2)*30*(1-k*.15);if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();}
  }else if(S.type==='roof'){
    ctx.fillStyle='#fff';for(let k=0;k<60;k++){ctx.globalAlpha=.3+.5*rnd(k);circle(rnd(k)*W,rnd(k+30)*200,.8+rnd(k+2));}
    ctx.globalAlpha=1;
    for(let k=0;k<16;k++){const bw=50+rnd(k)*40,bh=100+rnd(k+4)*170,bx=k*62-10;ctx.fillStyle='#0f1a2a';ctx.fillRect(bx,GY-bh,bw,bh);
      for(let wy=GY-bh+8;wy<GY-10;wy+=16)for(let wx=bx+6;wx<bx+bw-6;wx+=12)if(rnd(wx+wy*2)>.6){ctx.fillStyle='#ffd86b';ctx.fillRect(wx,wy,5,7);}}
    ctx.strokeStyle='#1c2b40';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(800,GY);ctx.lineTo(800,110);ctx.stroke();
    ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(770,GY);ctx.lineTo(800,160);ctx.lineTo(830,GY);ctx.stroke();
    ctx.fillStyle=Math.sin(tt*.08)>0?'#ff3b3b':'#4a1010';circle(800,106,7);
    ctx.strokeStyle='#394a63';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,GY-60);ctx.lineTo(W,GY-60);ctx.stroke();
    for(let x=0;x<=W;x+=40){ctx.beginPath();ctx.moveTo(x,GY-60);ctx.lineTo(x,GY);ctx.stroke();}
  }
  if(S.type==='photo'){
    g=ctx.createLinearGradient(0,GY,0,H);g.addColorStop(0,'rgba(0,0,0,.12)');g.addColorStop(1,'rgba(0,0,0,.55)');
    ctx.fillStyle=g;ctx.fillRect(0,GY,W,H-GY);
    ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(0,GY,W,3);
    return;
  }
  g=ctx.createLinearGradient(0,GY,0,H);g.addColorStop(0,S.ground);g.addColorStop(1,S.g2);
  ctx.fillStyle=g;ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle='rgba(255,255,255,.14)';ctx.fillRect(0,GY,W,3);
  ctx.strokeStyle='rgba(0,0,0,.16)';ctx.lineWidth=2;
  for(let k=-8;k<=8;k++){ctx.beginPath();ctx.moveTo(480+k*30,GY);ctx.lineTo(480+k*120,H);ctx.stroke();}
}

/* ================= DRAW: CHARACTERS ================= */
function drawHead(ch,cx,cy,s,mood){
  ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);
  const st=ch.style,hair=ch.hair,skin=ch.skin;
  const cap=(col,r)=>{ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,r||22.5,Math.PI+.45,TAU-.45);ctx.closePath();ctx.fill();};
  ctx.fillStyle=hair;
  if(st==='long')rrf(-30,-16,38,66,15);
  else if(st==='afro')circle(-2,-8,32);
  else if(st==='bun')circle(-10,-30,11);
  else if(st==='pigtails'){circle(-26,8,10);circle(-8,-30,9);}
  else if(st==='hijab'){circle(0,0,27);ell(-3,26,24,14);}
  ctx.fillStyle=skin;
  if(st==='hijab')ell(5,3,17,19);else circle(0,0,22);
  ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=2.2;ctx.beginPath();
  if(st==='hijab')ctx.ellipse(5,3,17,19,0,0,TAU);else ctx.arc(0,0,22,0,TAU);
  ctx.stroke();
  ctx.fillStyle=hair;
  if(st==='spiky'){
    cap(hair);ctx.beginPath();
    [[-23,-2],[-31,-25],[-15,-15],[-14,-41],[0,-19],[8,-46],[14,-16],[30,-31],[23,-2],[10,-12],[-10,-12]].forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.closePath();ctx.fill();
  }else if(st==='bun'||st==='long'||st==='pigtails'){
    cap(hair);
    if(st==='pigtails'){ctx.fillStyle=ch.col;circle(-24,2,3.5);circle(-9,-25,3.5);}
    if(st==='long'){ctx.fillStyle=ch.col;circle(-12,-18,5);}
  }else if(st==='afro')cap(hair,25);
  else if(st==='cap'){cap(ch.col);ctx.fillStyle=dk(ch.col,.7);rrf(4,-13,34,8,4);}
  else if(st==='peci'){
    ctx.fillStyle='#161616';ctx.beginPath();ctx.moveTo(-18,-8);ctx.lineTo(-15,-33);ctx.lineTo(15,-33);ctx.lineTo(18,-8);ctx.closePath();ctx.fill();
    ctx.fillStyle='#d4af37';ctx.fillRect(-17,-14,34,3);
  }else if(st==='bald'){ctx.fillStyle=ch.col;rrf(-22,-13,44,8,3);ctx.fillStyle='#fff';circle(0,-9,3);}
  else if(st==='mohawk'){
    ctx.beginPath();
    [[-8,-14],[-6,-38],[0,-24],[4,-46],[9,-26],[14,-38],[14,-12]].forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.closePath();ctx.fill();
  }else if(st==='hijab'){ctx.strokeStyle=dk(hair,.6);ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(5,3,17,19,0,0,TAU);ctx.stroke();}
  const ex=st==='hijab'?[7,17]:[5,16],ey=st==='hijab'?-1:-2;
  if(mood==='hurt'){
    ctx.strokeStyle='#222';ctx.lineWidth=2.4;
    for(const x of ex){ctx.beginPath();ctx.moveTo(x-3,ey-3);ctx.lineTo(x+3,ey+3);ctx.moveTo(x+3,ey-3);ctx.lineTo(x-3,ey+3);ctx.stroke();}
  }else{
    ctx.fillStyle='#fff';for(const x of ex)ell(x,ey,3.6,4.4);
    ctx.fillStyle='#111';for(const x of ex)circle(x+1.2,ey+.4,2.2);
    if(mood!=='win'){
      ctx.strokeStyle='#222';ctx.lineWidth=2.2;ctx.beginPath();
      ctx.moveTo(ex[0]-4,ey-7);ctx.lineTo(ex[0]+4,ey-4);ctx.moveTo(ex[1]-4,ey-4);ctx.lineTo(ex[1]+4,ey-7);ctx.stroke();
    }
  }
  if(ch.glasses){
    ctx.strokeStyle='#333';ctx.lineWidth=1.6;
    for(const x of ex){ctx.beginPath();ctx.arc(x,ey,6.4,0,TAU);ctx.stroke();}
    ctx.beginPath();ctx.moveTo(ex[0]+6.4,ey);ctx.lineTo(ex[1]-6.4,ey);ctx.stroke();
  }

    ctx.strokeStyle=on?'#fff':'rgba(255,255,255,.3)';ctx.lineWidth=on?5:2;rr(r.x,r.y,r.w,r.h,12);ctx.stroke();
    drawHead(c,r.x+r.w/2,r.y+62+(on?Math.sin(t*.15)*2:0),on?1.55:1.4,on?'shout':'n');
    txt(c.n,r.x+r.w/2,r.y+r.h-20,26,'#fff','center','#000');
    if(selStep===1&&sel[0]===i)txt('P1',r.x+22,r.y+16,20,'#7dff7d','center','#000');
    if(on)txt(selStep===0?'P1':(mode==='vs2p'?'P2':'CPU'),r.x+r.w-22,r.y+16,20,selStep===0?'#7dff7d':'#ff6b6b','center','#000');
  }
  const c=CH[cur];
  ctx.fillStyle='rgba(0,0,0,.6)';rrf(40,442,880,88,12);
  drawHead(c,90,488,1.3,'shout');
  txt(c.n,150,468,38,c.col,'left','#000');txt(c.tag,150,500,20,'#fff','left');
  txt('SPECIAL: '+c.spn,360,466,22,'#ffd23f','left','#000');txt(c.d,360,498,18,'#fff','left');
  [['HP',c.hp/115],['SPD',c.spd/5.8],['POW',c.pow/1.35]].forEach((s,i)=>{
    const y=462+i*20;txt(s[0],700,y,14,'#fff','left');
    ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(740,y-5,150,10);ctx.fillStyle=c.col;ctx.fillRect(740,y-5,150*clamp(s[1],0,1),10);
  });
}
function draw(){
  ctx.save();ctx.clearRect(0,0,W,H);
  if(phase==='menu')drawMenu();
  else if(phase==='controls')drawControls();
  else if(phase==='select')drawSelect();
  else if(phase==='fight')drawFight();
  ctx.restore();
}

/* ================= LOOP ================= */
let last=performance.now(),acc=0;
function loop(now){
  const dt=Math.min(100,now-last);last=now;acc+=dt;
  while(acc>=16.667){step();acc-=16.667;}
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
